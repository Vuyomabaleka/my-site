<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections - Ilifa for Gqeberha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h1>ILIFA</h1>
                <p class="tagline">for Gqeberha</p>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="collections.html" class="active">Collections</a></li>
            </ul>
        </div>
    </nav>

    <section class="collections-hero">
        <h2>Our Collections</h2>
        <p>Choose your perfect timepiece</p>
    </section>

    <section class="collection-selector">
        <div class="container">
            <div class="selector-grid">
                <a href="mens-collection.html" class="collection-card-link">
                    <div class="collection-card">
                        <img src="Mens collection cover.jpg" alt="Mens Collection" class="collection-card-image">
                        <h3>Mens Collection</h3>
                        <p>Sophisticated designs for the modern man</p>
                        <button class="btn btn-secondary">View Collection</button>
                    </div>
                </a>
                <a href="womens-collection.html" class="collection-card-link">
                    <div class="collection-card">
                        <img src="Womens Collection cover.jpg" alt="Womens Collection" class="collection-card-image">
                        <h3>Womens Collection</h3>
                        <p>Elegant styles for the modern woman</p>
                        <button class="btn btn-secondary">View Collection</button>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Ilifa for Gqeberha. All rights reserved.</p>
    </footer>

</html>
