<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Ilifa for Gqeberha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h1>ILIFA</h1>
                <p class="tagline">for Gqeberha</p>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="collections.html">Collections</a></li>
            </ul>
        </div>
    </nav>

    <section class="collections-hero">
        <h2>Shopping Cart</h2>
        <p>Review your items</p>
    </section>

    <section class="cart-section">
        <div class="container">
            <div class="cart-container">
                <div class="cart-items">
                    <h3>Your Cart</h3>
                    <div id="cart-items-display"></div>
                </div>
                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-item">
                        <span>Subtotal:</span>
                        <span id="subtotal">R0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Shipping:</span>
                        <span>Free</span>
                    </div>
                    <div class="summary-total">
                        <span>Total:</span>
                        <span id="total">R0.00</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary btn-full">Proceed to Checkout</a>
                    <a href="collections.html" class="btn btn-secondary btn-full">Continue Shopping</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Ilifa for Gqeberha. All rights reserved.</p>
    </footer>

    <script>
        // Get cart data from URL parameters
        function displayCart() {
            const params = new URLSearchParams(window.location.search);
            const watchName = params.get('watch');
            const watchPrice = params.get('price');
            const watchCollection = params.get('collection');

            if (!watchName) {
                document.getElementById('cart-items-display').innerHTML = '<p class="empty-cart">Your cart is empty. <a href="collections.html">Continue shopping</a></p>';
                return;
            }

            const cartHTML = `
                <div class="cart-item">
                    <div class="item-details">
                        <h4>${watchName}</h4>
                        <p class="item-collection">${watchCollection}</p>
                    </div>
                    <div class="item-price">${watchPrice}</div>
                    <a href="collections.html" class="remove-btn">Remove</a>
                </div>
            `;
            document.getElementById('cart-items-display').innerHTML = cartHTML;
            
            // Extract price as number
            const priceNum = parseFloat(watchPrice.replace('R', '').replace(',', ''));
            document.getElementById('subtotal').textContent = watchPrice;
            document.getElementById('total').textContent = watchPrice;

            // Store in sessionStorage for checkout page
            sessionStorage.setItem('cartWatch', JSON.stringify({
                name: watchName,
                price: watchPrice,
                priceNum: priceNum,
                collection: watchCollection
            }));
        }

        displayCart();
    </script>
</body>
</html>
