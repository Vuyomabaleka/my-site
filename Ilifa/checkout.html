<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ilifa for Gqeberha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h1>ILIFA</h1>
                <p class="tagline">for Gqeberha</p>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="collections.html">Collections</a></li>
            </ul>
        </div>
    </nav>

    <section class="collections-hero">
        <h2>Checkout</h2>
        <p>Complete your purchase</p>
    </section>

    <section class="checkout-section">
        <div class="container">
            <div class="checkout-container">
                <div class="checkout-form-wrapper">
                    <h3>Billing Information</h3>
                    <form class="checkout-form" id="checkout-form">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>

                        <div class="form-divider"></div>

                        <h3>Shipping Address</h3>

                        <div class="form-group">
                            <label for="address">Street Address *</label>
                            <input type="text" id="address" name="address" required>
                        </div>

                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="province">Province/State *</label>
                                <input type="text" id="province" name="province" required>
                            </div>

                            <div class="form-group">
                                <label for="postalCode">Postal Code *</label>
                                <input type="text" id="postalCode" name="postalCode" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="country">Country *</label>
                            <input type="text" id="country" name="country" value="South Africa" required>
                        </div>

                        <div class="form-divider"></div>

                        <h3>Payment Information</h3>

                        <div class="form-group">
                            <label for="cardName">Cardholder Name *</label>
                            <input type="text" id="cardName" name="cardName" required>
                        </div>

                        <div class="form-group">
                            <label for="cardNumber">Card Number *</label>
                            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiry">Expiry Date *</label>
                                <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
                            </div>

                            <div class="form-group">
                                <label for="cvv">CVV *</label>
                                <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
                            </div>
                        </div>

                        <div class="form-checkbox">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">I agree to the terms and conditions</label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full">Complete Purchase</button>
                        <a href="cart.html" class="btn btn-secondary btn-full">Back to Cart</a>
                    </form>
                </div>

                <div class="checkout-summary">
                    <h3>Order Summary</h3>
                    <div id="order-item"></div>
                    <div class="summary-total">
                        <span>Total:</span>
                        <span id="checkout-total">R0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Ilifa for Gqeberha. All rights reserved.</p>
    </footer>

    <script>
        // Display order summary from sessionStorage
        function displayOrderSummary() {
            const cartData = sessionStorage.getItem('cartWatch');
            
            if (!cartData) {
                document.getElementById('order-item').innerHTML = '<p>No items in cart</p>';
                return;
            }

            const watch = JSON.parse(cartData);
            const summaryHTML = `
                <div class="summary-item-detail">
                    <div>
                        <h4>${watch.name}</h4>
                        <p class="item-collection">${watch.collection}</p>
                    </div>
                    <div class="item-price">${watch.price}</div>
                </div>
            `;
            document.getElementById('order-item').innerHTML = summaryHTML;
            document.getElementById('checkout-total').textContent = watch.price;
        }

        // Handle form submission
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show success message
            const formData = new FormData(this);
            const customerName = formData.get('firstName') + ' ' + formData.get('lastName');
            
            // In a real scenario, this would send to a backend
            alert(`Thank you for your purchase, ${customerName}!\n\nYour order has been confirmed. You will receive a confirmation email at ${formData.get('email')} shortly.`);
            
            // Clear session storage
            sessionStorage.removeItem('cartWatch');
            
            // Redirect to home
            window.location.href = 'index.html';
        });

        displayOrderSummary();
    </script>
</body>
</html>
